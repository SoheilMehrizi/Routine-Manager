var ks=Object.keys(c).sort(),best=0,run=0,prev=null;ks.forEach(function(k){run=(prev&&addD(prev,1)===k)?run+1:1;prev=k;if(run>best)best=run});return{cur:cur,best:best}}
function lvl(n){return n<=0?0:n===1?1:n===2?2:n<=4?3:4}
function heat(){var c=hmCounts(),st=streakOf(c),w0=addD(wStart(TODAY),-52*7),cells="",mon="",total=0,i,r,lastM=-1;
for(i=0;i<53;i++){var ws=addD(w0,i*7),m=parts(ws).month;if(m!==lastM&&!(i===0&&parts(addD(ws,7)).month!==m))mon+='<span style="grid-column:'+(i+1)+'">'+fmt(ws,{month:"short"})+"</span>";lastM=m;

var h='<div class="card"><div class="row sp"><b>'+nf(total)+" "+tr("completed activities in the last year")+'</b><span class="mut">'+tr("Current streak")+": <b>"+nf(st.cur)+"</b> "+tr("days")+" · "+tr("Longest streak")+": <b>"+nf(st.best)+"</b> "+tr("days")+'</span></div><div class="hmw" dir="ltr" style="margin-top:10px"><div class="hml">'+wl+"</div><div><div class=\"hmm\">"+mon+'</div><div class="hm">'+cells+'</div></div></div><div class="leg" dir="ltr">'+tr("Less")+" "+[0,1,2,3,4].map(function(n){return'<i class="hc l'+n+'"></i>'}).join("")+" "+tr("More")+"</div>";
