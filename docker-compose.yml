services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mel -d mel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://mel:${POSTGRES_PASSWORD_URLENCODED}@db:5432/mel"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/auth/google-calendar/callback
      FRONTEND_URL: ${PUBLIC_URL}
    expose:
      - "8000"

  web:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
